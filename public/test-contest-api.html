<!DOCTYPE html>
<html>
<head>
    <title>Test Contest API</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        pre { background: #000; padding: 15px; border: 1px solid #0f0; overflow-x: auto; white-space: pre-wrap; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <h1>🧪 Contest API Test</h1>
    <button onclick="testContests()">Test Contests API</button>
    <button onclick="testSubmissionCalendar()">Test Submission Calendar (need user_id)</button>
    <div id="result"></div>

    <script>
        async function testContests() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>⏳ Fetching contests...</p>';
            
            try {
                const response = await fetch('/api/contests');
                const data = await response.json();
                
                result.innerHTML = `
                    <h2>✅ Contests Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <h3>Parsed Contest Names:</h3>
                    ${data.contests ? data.contests.map(c => `
                        <div style="border: 1px solid #0f0; margin: 10px 0; padding: 10px;">
                            <strong>Platform:</strong> ${c.platform}<br>
                            <strong>Name:</strong> ${c.name}<br>
                            <strong>Start:</strong> ${new Date(c.start_time).toLocaleString()}<br>
                            <strong>Duration:</strong> ${Math.floor(c.duration / 3600)}h ${Math.floor((c.duration % 3600) / 60)}m
                        </div>
                    `).join('') : 'No contests'}
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function testSubmissionCalendar() {
            const userId = prompt('Enter your user_id (UUID):');
            if (!userId) return;
            
            const result = document.getElementById('result');
            result.innerHTML = '<p>⏳ Fetching submission calendar...</p>';
            
            try {
                const response = await fetch(`/api/submission-calendar?user_id=${userId}&cc_username=test`);
                const data = await response.json();
                
                result.innerHTML = `
                    <h2>✅ Submission Calendar Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <h3>CodeChef Data:</h3>
                    <p>Total dates: ${Object.keys(data.codechef || {}).length}</p>
                    <pre>${JSON.stringify(data.codechef, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
